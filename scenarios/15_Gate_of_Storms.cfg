        #tint the screen pink when moving the mouse close to the gate
        [lua]
            code = <<
                local hexutils = wesnoth.require("~add-ons/Flight_Freedom/lua/hexutils.lua")
                local old_on_mouse_move = wesnoth.game_events.on_mouse_move or (function() end)
                wesnoth.game_events.on_mouse_move = function(x, y)
                    old_on_mouse_move(x, y)
                    if wml.variables["disable_tint"] == nil or wml.variables["disable_tint"] == false then
                        local dist = hexutils.distance_between_hexes_cartesian(43, 4, x, y)
                        if dist < 10.0 then
                            local intensity = (10.0 - dist) / 10.0
                            local r = math.floor(intensity*100.0)
                            local g = math.floor(intensity*7.8)
                            local b = math.floor(intensity*57.4)
                            wesnoth.interface.color_adjust(r, g, b)
                        else
                            wesnoth.interface.color_adjust(0, 0, 0)
                        end
                    end
                end
            >>
        [/lua]
    [/event]

