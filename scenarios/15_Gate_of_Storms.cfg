#textdomain wesnoth-Flight_Freedom

[scenario]
    name= _ "Gate of Storms"
    map_file=15_Gate_of_Storms.map
    {TURNS 32 30 28}
#ifdef HAVE_UMC10_MUSIC
    {SCENARIO_MUSIC acherontic.ogg}
#else
    {SCENARIO_MUSIC the_city_falls.ogg}
#endif
    id=Gate_Storms
    victory_when_enemies_defeated=no
    next_scenario="Exodus"

#ifdef HAVE_AWAS
    {DEFAULT_SCHEDULE}
#else
    {ADD_WEATHER_ASHFALL}
    {WEATHER_CONTROLLER}
    {DEFAULT_SCHEDULE_ASHFALL}
#endif

    [side]
        type=Drake Chieftain
        id=Malakar
        name= _ "Malakar"
        side=1
        {FLAG_VARIANT drake}
        canrecruit=yes
        controller=human
        recruit=Drake Hatchling,Drake Slave,Drake Burner,Drake Glider,Drake Fighter,Drake Clasher
        unrenamable=yes
        team_name=good
        user_team_name= _ "Kakatar Flight"
        fog=no
        {GOLD 180 140 100}
        {INCOME 3 2 1}
    [/side]
    #every side 2 turn, the enemy lich leader is moved here so he has a chance to attack
    [side]
        side=2
        no_leader=yes
        team_name=evil
        hidden=yes
        recruit=
        gold=0
        income=-2
    [/side]
    #then he gets moved here every side 3 turn
    [side]
        id=s15_undead_leader
#ifdef EASY
        type=Lich
#else
        type=Ancient Lich
#endif
        side=3
        {FLAG_VARIANT undead}
        controller=ai
        canrecruit=yes
        {GOLD 250 300 350}
        recruit=Skeleton,Skeleton Archer,Ghoul,Ghost,Skeleton Rider,Dark Adept,Minor Spirit
        team_name=evil
        user_team_name= _ "Gate Guardians"
        color=blue
        [ai]
            #leader already had chance to attack when he was part of side 2
            passive_leader=yes
            #force him to recruit at least one Minor Spirit on turn 1
            [aspect]
                id=recruitment_instructions
                [facet]
                    turns=1
                    [value]
                        [recruit]
                            type=Minor Spirit
                            number=1
                            total=yes
                            importance=1
                        [/recruit]
                        [recruit]
                            importance=0
                        [/recruit]
                    [/value]
                [/facet]
            [/aspect]
        [/ai]
        [ai]
            [avoid]
                x=38
                y=7
            [/avoid]
        [/ai]
    [/side]
    [side]
        side=4
        {FLAG_VARIANT6 ragged}
        controller=ai
        recruit=
        no_leader=yes
        team_name=evil
        user_team_name= _ "Gate Guardians"
        color=green
    [/side]

#define GATE_LOC
x,y=43,4#enddef

    [label]
        {GATE_LOC}
        text= _ "Gate of Storms"
    [/label]

    {OBJECTIVES_HEADER_BEGIN}
        summary= _ "Destroy the Gate of Storms"
        {CONDITION_WIN ( _ "Move a unit onto the Gate of Storms")}
        {OBJECTIVES_LOSE}
        [gold_carryover]
            carryover_percentage={ON_DIFFICULTY 90 80 70}
        [/gold_carryover]
    {OBJECTIVES_FOOTER_BEGIN}

#define GATE_ITEM
    [item]
        {GATE_LOC}
        halo=scenery/gate-storms1.png,scenery/gate-storms2.png,scenery/gate-storms3.png,scenery/gate-storms2.png
        #in case halos are turned off
        image=scenery/gate-storms.png
    [/item]
#enddef

    #since he should mostly recruit undead
#ifdef EASY
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 "Minor Spirit" 2}
#else
    #when not easy, can only have one at a time since they're really not that great vs. drakes
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 "Minor Spirit" 1}
#endif

    [event]
        name=preload
        first_time_only=no
        [lua]
            code = <<
                conceal_sides_sidebar({3})
            >>
        [/lua]
    [/event]

    [event]
        name=prestart
        {VARIABLE spirit_counter 0}
        #gate
        {GATE_ITEM}
        [item]
            x=34
            y=1
            halo=scenery/fire[1~8].png
        [/item]
        [item]
            x=44
            y=8
            halo=scenery/fire[2~8,1].png
        [/item]
        [item]
            x=42
            y=17
            halo=scenery/fire[5~8,1~4].png
        [/item]
        [item]
            x=33
            y=9
            halo=scenery/fire[7~8,1~6].png
        [/item]
        [sound_source]
            id=gate_wind
            x,y=38,7
            sounds=howling-wind-loop.ogg
            delay=0
            loop=-1
            check_fogged=no
            check_shrouded=no
        [/sound_source]
        [if]
            [variable]
                name=gave_up_kogw
                boolean_equals=no
            [/variable]
            [then]
                [recall]
                    id=Kogw
                    x,y=11,25
                [/recall]
            [/then]
            [else]
                [recall]
                    id=Theracar
                    x,y=11,25
                [/recall]
            [/else]
        [/if]
        [recall]
            id=Elealonna
            x,y=12,26
        [/recall]
        [unit]
            x,y=41,5
            side=4
            type=Major Spirit
            id=Thromor
            name= _ "Thromor"
        [/unit]
        [micro_ai]
            side=4
            ai_type=zone_guardian
            action=add
            id=Thromor
            [filter_location]
                [and]
                    {GATE_LOC}
                    radius=6
                [/and]
            [/filter_location]
        [/micro_ai]
        [set_variable]
            name=base_undead_income
            value={ON_DIFFICULTY 18 20 22}
        [/set_variable]
        #lower number corresponds to faster gold increase
        [set_variable]
            name=undead_income_ramp
            value={ON_DIFFICULTY 1.7 1.5 1.3}
        [/set_variable]
        #~50% of undead get this much exp per turn, the others get this much + 1 (to avoid large chunks of the enemy army leveling at once)
        {VARIABLE undead_base_turn_exp 4}
        {VARIABLE malakar_creepy_chats 0}
        {VARIABLE enemy_leader_killed 0}
        {VARIABLE barrier_notice no}
        {VARIABLE slow_field_triggered no}
#ifdef HAVE_AWAS
        [AWaS_Create_Basic_Scenery]
            id=ashfall
            Scenery_Type=ash_fall
            [filter_location]
            [/filter_location]
        [/AWaS_Create_Basic_Scenery]
#endif
    [/event]

    [event]
        name=start
#ifndef HAVE_AWAS
        {WEATHER_EXPLANATION_MESSAGE}
        [fire_event]
            name=update_weather
        [/fire_event]
#endif
        [if]
            [variable]
                name=gave_up_kogw
                boolean_equals=no
            [/variable]
            [then]
                [message]
                    speaker=Kogw
                    message= _ "There, beyond that castle! This is the Gate of Storms!"
                [/message]
                [message]
                    speaker=Malakar
                    message= _ "I want three scouts sent south and east.
Find a safe path past the Gate.
Hopefully, it will distract and slow any who would follow us."
                [/message]
                [message]
                    speaker=Kogw
                    message= _ "With respect, Malakar, the Gate is open. It probably doesn't matter what we do - in time, this island, Wesnoth and all of Morogor will be overrun and destroyed. You can run to the ends of the world, and rotting corpses will still hound your steps..."
                [/message]
                [message]
                    speaker=Malakar
                    sound=fire.wav
                    message="<span size='large'>" + _ "*<i>growls</i>*" + "</span>" # wmllint: ignore
                [/message]
                [message]
                    speaker=Kogw
                    message= _ "...never sleeping, never stopping, never tiring, hungering only for blood..."
                [/message]
                [message]
                    speaker=Malakar
                    message= _ "I have new orders.
I want any available scouts to investigate the Gate.
We will see if it has a weakness.
Then attempt to shut it before moving on."
                [/message]
            [/then]
            [else]
                [message]
                    speaker=Theracar
                    message= _ "There, beyond that castle!
This must be the Gate of Storms!"
                [/message]
                [message]
                    speaker=Malakar
                    message= _ "I want three scouts sent south and east.
Hopefully, we can slip past the Gate.
The undead will distract and slow any who would follow us."
                [/message]
                [message]
                    speaker=Theracar
                    message= _ "The undead are seemingly without number.
The thunder spirits have not ceased to assail us.

I fear that there is no safe path.
Our only hope of escape is to destroy the Gate!"
                [/message]
                [message]
                    speaker=Malakar
                    message= _ "Your counsel is wise, First Intendant.

I have new orders.
I want any available scouts to investigate the Gate.
We will see if it has a weakness.
Then attempt to shut it before moving on."
                [/message]
            [/else]
        [/if]
        {VARIABLE gate_state 0}
    [/event]

    [event]
        name=recall
        #wmllint: recognize Morlin Ka
        [filter]
            id=Morlin Ka
        [/filter]
        [message]
            speaker=Morlin Ka
            message= _ "This gate is an abomination!
Gar-Alagar wills its destruction.
Forward, drakes!"
        [/message]
    [/event]

    [event]
        name=prerecruit,prerecall
        first_time_only=no
        [filter]
            side=3
            type=Minor Spirit
        [/filter]
        [remove_item]
            {GATE_LOC}
        [/remove_item]
        [item]
            {GATE_LOC}
            image=scenery/gate-storms4.png
            halo=halo/shadow-mage-halo1.png,halo/shadow-mage-halo2.png,halo/shadow-mage-halo3.png,halo/shadow-mage-halo4.png,halo/shadow-mage-halo5.png,halo/shadow-mage-halo6.png,halo/shadow-mage-halo7.png,halo/shadow-mage-halo8.png,halo/shadow-mage-halo9.png,halo/shadow-mage-halo10.png
        [/item]
        [delay]
            time=200
        [/delay]
        [remove_item]
            {GATE_LOC}
        [/remove_item]
        {GATE_ITEM}
    [/event]

    {RECRUIT_RUN_FILTER 43 4 38 6 3 (type=Minor Spirit)}
    {RECRUIT_RUN_FILTER 43 4 37 7 3 (type=Minor Spirit)}
    {RECRUIT_RUN_FILTER 43 4 39 7 3 (type=Minor Spirit)}
    {RECRUIT_RUN_FILTER 43 4 37 8 3 (type=Minor Spirit)}
    {RECRUIT_RUN_FILTER 43 4 39 8 3 (type=Minor Spirit)}
    {RECRUIT_RUN_FILTER 43 4 38 8 3 (type=Minor Spirit)}

    [event]
        name=moveto
        [filter]
            {GATE_LOC}
            id=Malakar
        [/filter]
        [if]
            [variable]
                name=malakar_creepy_chats
                numerical_equals=4
            [/variable]
            [then]
                [volume]
                    sound=100
                [/volume]
                [message]
                    speaker=narrator
                    image=scenery/gate-storms4.png
                    sound=lich-die.ogg
                    message= _ "Join us... bring death to the humans... bring death to ALL!"
                [/message]
                [message]
                    speaker=Malakar
                    message= _ "..."
                    [option]
                        label= _ "I! Am! MALAKAR! And I reject your evil!"
                        default=yes
                        [command]
                            [if]
                                # wmllint: conditional tag replay_mode
                                [replay_mode]
                                [/replay_mode]
                                [then]
                                    [message]
                                        speaker=Malakar
                                        message= _ "I! Am! MALAKAR! And I reject your evil!"
                                    [/message]
                                [/then]
                            [/if]
                            [fire_event]
                                name=scale_volume
                            [/fire_event]
                            [message]
                                speaker=narrator
                                image=scenery/gate-storms4.png
                                message= _ "Death shall find you... in the end..."
                            [/message]
                            [message]
                                speaker=Malakar
                                message= _ "Then I shall live on in the memory of my flight.
Begone!"
                            [/message]
                            [modify_unit]
                                [filter]
                                    id=Malakar
                                [/filter]
                                {TRAIT_FEARLESS}
                            [/modify_unit]
                            [message]
                                speaker=narrator
                                {NARRATOR_ICON}
                                message= _ "Malakar gains the Fearless trait!"
                                # wmllint: no-icon
                            [/message]
                        [/command]
                    [/option]
                    [option]
                        label= _ "I... I must submit... I surrender to you..."
                        [command]
                            [if]
                                # wmllint: conditional tag replay_mode
                                [replay_mode]
                                [/replay_mode]
                                [then]
                                    [message]
                                        speaker=Malakar
                                        message= _ "I... I must submit... I surrender to you..."
                                    [/message]
                                [/then]
                            [/if]
                            [remove_item]
                                {GATE_LOC}
                            [/remove_item]
                            [terrain]
                                {GATE_LOC}
                                terrain=Uu
                            [/terrain]
                            [label]
                                {GATE_LOC}
                                text=""
                            [/label]
                            [item]
                                {GATE_LOC}
                                image=scenery/gate-storms4.png
                            [/item]
                            [message]
                                speaker=narrator
                                image=scenery/gate-storms4.png
                                sound=shassa-laugh.ogg
                                message= _ "Then enter... embrace the End of all things!"
                            [/message]
                            [store_unit]
                                [filter]
                                    id=Malakar
                                [/filter]
                                variable=malakar_store
                            [/store_unit]
                            [kill]
                                id=Malakar
                                animate=no
                                fire_event=no
                            [/kill]
                            [if]
                                [variable]
                                    name=malakar_store.type
                                    equals="Drake Chieftain"
                                [/variable]
                                [then]
                                    [unit]
                                        {GATE_LOC}
                                        type=Drake Chieftain Silhouette
                                        facing=se
                                    [/unit]
                                [/then]
                                [else]
                                    [unit]
                                        {GATE_LOC}
                                        type=Drake Lord Silhouette
                                        facing=se
                                    [/unit]
                                [/else]
                            [/if]
                            {CLEAR_VARIABLE malakar_store}
                            [kill]
                                {GATE_LOC}
                                animate=yes
                                fire_event=no
                            [/kill]
                            [unit]
                                {GATE_LOC}
                                type=Avatar of Ending
                                unrenamable=yes
                                id=Malakar
                                name= _ "Malakar"
                                side=1
                                canrecruit=yes
                                facing=se
                            [/unit]
                            [delay]
                                time=500
                            [/delay]
                            #just in case a unit is here
                            [if]
                                [variable]
                                    name=gave_up_kogw
                                    boolean_equals=no
                                [/variable]
                                [then]
                                    {MOVE_UNIT_DISPLACE_CURRENT 42 4 (
                                        id=Kogw
                                        fire_event=no
                                    )}
                                [/then]
                                [else]
                                    {MOVE_UNIT_DISPLACE_CURRENT 42 4 (
                                        id=Theracar
                                        fire_event=no
                                    )}
                                [/else]
                            [/if]
                            [scroll_to_unit]
                                id=Malakar
                            [/scroll_to_unit]
                            [lock_view]
                            [/lock_view]
                            [store_unit]
                                [filter]
                                    side=3,4
                                [/filter]
                                variable=enemy_units
                            [/store_unit]
                            [foreach]
                                array=enemy_units
                                variable=this_item
                                readonly=no
                                [do]
                                    {VARIABLE this_item.side 1}
                                    {VARIABLE this_item.canrecruit no}
                                    [unstore_unit]
                                        variable=this_item
                                    [/unstore_unit]
                                [/do]
                            [/foreach]
                            {CLEAR_VARIABLE enemy_units}
                            [message]
                                speaker=Kogw
                                message= _ "Mal, what have you done???"
                            [/message]
                            [message]
                                speaker=Theracar
                                message= _ "Malakar...
You have betrayed the flight and I shall strike you down!"
                            [/message]
                            [message]
                                speaker=Malakar
                                message="<span color='purple' size='larger'><b><i>" + _ "END." + "</i></b></span>"
                            [/message]
                            [animate_unit]
                                [filter]
                                    {GATE_LOC}
                                [/filter]
                                flag=attack
                                [primary_attack]
                                    range=ranged
                                [/primary_attack]
                                hits=kill
                                [facing]
                                    x,y=42,4
                                [/facing]
                            [/animate_unit]
                            [if]
                                [variable]
                                    name=gave_up_kogw
                                    boolean_equals=no
                                [/variable]
                                [then]
                                    [sound]
                                        name=scream.ogg
                                    [/sound]
                                    [delay]
                                        time=500
                                    [/delay]
                                    [kill]
                                        id=Kogw
                                        animate=yes
                                        fire_event=no
                                        [secondary_unit]
                                            id=Malakar
                                        [/secondary_unit]
                                        [primary_attack]
                                            range=ranged
                                        [/primary_attack]
                                    [/kill]
                                    {VARIABLE kogw_alive no}
                                [/then]
                                [else]
                                    [sound]
                                        name=fire.wav
                                    [/sound]
                                    [delay]
                                        time=500
                                    [/delay]
                                    [kill]
                                        id=Theracar
                                        animate=yes
                                        fire_event=no
                                        [secondary_unit]
                                            id=Malakar
                                        [/secondary_unit]
                                        [primary_attack]
                                            range=ranged
                                        [/primary_attack]
                                    [/kill]
                                    {VARIABLE theracar_alive no}
                                [/else]
                            [/if]
                            [delay]
                                time=3000
                                accelerate=yes
                            [/delay]
                            [unlock_view]
                            [/unlock_view]
                            [kill]
                                side=1
                                [not]
                                    id=Malakar
                                [/not]
                            [/kill]
                            {VARIABLE ending "portal"}
                            [music]
                                name=silence.ogg
                                immediate=yes
                            [/music]
                            [volume]
                                music=100
                            [/volume]
                            [endlevel]
                                result=victory
                                carryover_report=no
                                linger_mode=no
                                music=silence.ogg
                                next_scenario=Drake_Epilogue
                            [/endlevel]
                        [/command]
                    [/option]
                [/message]
            [/then]
        [/if]
    [/event]

    [event]
        name=moveto
        [filter]
            {GATE_LOC}
            side=1
            [not]
                type=Drake Burner,Fire Drake,Inferno Drake,Armageddon Drake
            [/not]
        [/filter]
        [if]
            [variable]
                name=gate_state
                numerical_equals=0
            [/variable]
            [then]
                [if]
                    [variable]
                        name=unit.id
                        not_equals="Malakar"
                    [/variable]
                    [or]
                        [variable]
                            name=malakar_creepy_chats
                            numerical_not_equals=4
                        [/variable]
                    [/or]
                    [then]
                        [if]
                            [variable]
                                name=unit.id
                                equals="Elealonna"
                            [/variable]
                            [then]
                                [message]
                                    speaker=unit
                                    message= _ "The arcane energy density is too high, I cannot get close enough to touch the gate! Physical force will be worthless here!"
                                [/message]
                            [/then]
                            [else]
                                {MESSAGE_DRAKE_SPECIFIC unit ( _ "Such... strange... power.
I cannot get close enough to touch the gate.
Physical force is worthless here!") ( _ "Such... strange... power. I cannot get close enough to touch the gate. Physical force is worthless here!")}
                            [/else]
                        [/if]
                        [message]
                            speaker=Malakar
                            message= _ "The spirits are redoubling their efforts!

I need any remaining Burners to surround the Gate.
Get as close as you can and set it ablaze!
Everyone else, cover for them."
                        [/message]
                    [/then]
                [/if]
                {OBJECTIVES_HEADER}
                    summary= _ "Destroy the Gate of Storms"
                    {CONDITION_WIN ( _ "Move a Drake Burner, Fire Drake, Inferno Drake, or Armageddon Drake onto the Gate of Storms")}
                    {OBJECTIVES_LOSE}
                    [gold_carryover]
                        carryover_percentage={ON_DIFFICULTY 90 80 70}
                    [/gold_carryover]
                {OBJECTIVES_FOOTER}
            [/then]
            [else]
                [message]
                    speaker=narrator
                    {NARRATOR_ICON}
                    message= _ "A Fire, Inferno or Armageddon Drake is necessary to destroy the Gate of Storms."
                    # hey wmllint stop putting image=wesnoth-icon.png here; we already use {NARRATOR_ICON} above
                    # wmllint: no-icon
                [/message]
            [/else]
        [/if]
    [/event]

    #debating letting the player keep her after this scenario; it'd be cool to have an arch mage
    #(and likely level to great mage) along however would be very difficult to justify her
    #turning against Wesnoth
    [event]
        name=turn 3
        [message]
            speaker=Elealonna
            message= _ "I... I feel a coldness, a terrible, crushing coldness in my chest... I fear my time is coming to a close..."
        [/message]
    [/event]

    [event]
        name=turn 11
        [kill]
            id=Elealonna
            animate=yes
            fire_event=yes
        [/kill]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Elealonna
        [/filter]
        [message]
            speaker=Elealonna
            message= _ "And so it ends... grant final rest to my companions, I beg you..."
        [/message]
    [/event]

    [event]
        name=moveto
        [filter]
            {GATE_LOC}
            side=1
            type=Drake Burner
        [/filter]
        [message]
            speaker=unit
            # wmllint: general spelling firebreather
            message= _ "My fire is too weak.
We need a stronger firebreather!"
        [/message]
        {OBJECTIVES_HEADER}
            summary= _ "Destroy the Gate of Storms"
            {CONDITION_WIN ( _ "Move a Fire, Inferno or Armageddon Drake onto the Gate of Storms")}
            {OBJECTIVES_LOSE}
            [gold_carryover]
                carryover_percentage={ON_DIFFICULTY 90 80 70}
            [/gold_carryover]
        {OBJECTIVES_FOOTER}
        {VARIABLE gate_state 1}
    [/event]

    [event]
        name=moveto
        [filter]
            {GATE_LOC}
            type=Fire Drake,Inferno Drake,Armageddon Drake
        [/filter]
        [message]
            speaker=unit
            message= _ "I call upon Gar-Hagar, god of all that is burning and favored child of Gar-Alagar, to destroy this portal of evil!"
        [/message]
        [clear_chat]
        [/clear_chat]
        [remove_sound_source]
            id=gate_wind
        [/remove_sound_source]
        [volume]
            sound=100
        [/volume]
        [music]
            name=silence.ogg
            immediate=yes
        [/music]
        [sound]
            name=33943__scarbelly25__flamewind.ogg
        [/sound]
        [screen_fade]
            red,green,blue=100,0,0
            alpha=50
            duration=1000
        [/screen_fade]
        [for]
            start=1
            end=9
            [do]
                [item]
                    {GATE_LOC}
                    halo=halo/fire-beam/fire-beam-$i|.png
                    name=fire_beam
                [/item]
                [redraw]
                [/redraw]
                [delay]
                    time=300
                [/delay]
                [remove_item]
                    {GATE_LOC}
                    image=fire_beam
                [/remove_item]
            [/do]
        [/for]
        [remove_item]
            {GATE_LOC}
        [/remove_item]
        [item]
            {GATE_LOC}
            halo=scenery/gate-storms.png
            image=scenery/gate-storms.png
        [/item]
        [label]
            {GATE_LOC}
            text=""
        [/label]
        {VARIABLE disable_tint yes}
        [screen_fade]
            red,green,blue=0,0,0
            alpha=0
            duration=2000
        [/screen_fade]
