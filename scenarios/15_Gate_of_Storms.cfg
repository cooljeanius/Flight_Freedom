                        code = <<
                            local new_exp = wml.variables["this_item.experience"] + wml.variables["undead_base_turn_exp"]
                            local bonus_exp = string.byte(wml.variables["this_item.id"], -1, -1) % 2
                            wml.variables["this_item.experience"] = new_exp + bonus_exp
                        >>
