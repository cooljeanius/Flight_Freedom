        [event]
            name=recruit
            first_time_only=no
            [filter]
                side=3
                [not]
                    type=Minor Spirit
                [/not]
            [/filter]
            [lua]
                code = <<
                    local x = wml.variables["x1"]
                    local y = wml.variables["y1"]
                    local new_exp = wesnoth.current.turn * 3
                    new_exp = new_exp + math.ceil(random_norm(1 + (wesnoth.current.turn / 5), 1 + (wesnoth.current.turn / 8)))
                    new_exp = math.max(new_exp, 0)
                    while new_exp > 0 do
                        wesnoth.wml_actions.store_unit({wml.tag.filter({x=x, y=y}), variable="temp_unit"})
                        local max_exp = wml.variables["temp_unit.max_experience"]
                        if new_exp > max_exp then
                            wml.variables["temp_unit.experience"] = max_exp
                        else
                            wml.variables["temp_unit.experience"] = new_exp
                        end
                        new_exp = new_exp - wml.variables["temp_unit.experience"]
                        wesnoth.wml_actions.unstore_unit({variable="temp_unit"})
                    end
                >>
            [/lua]
            {CLEAR_VARIABLE temp_unit}
        [/event]

